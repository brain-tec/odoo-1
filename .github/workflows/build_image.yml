name: Build and Push Odoo + frePPLe Docker Image to GHCR

on:
  push:
    branches:
      - 16.0
  schedule:
      - cron: "0 0 0 * *"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build Docker Image
      run: |
        IMAGE_BASE=ghcr.io/frepple/frepple-enterprise-dev/odoo_frepple
        docker build -t $IMAGE_BASE:16.0 -t $IMAGE_BASE:latest .

    - name: Push Docker Image
      run: |
        IMAGE_BASE=ghcr.io/frepple/frepple-enterprise-dev/odoo_frepple
        docker push $IMAGE_BASE:16.0